name: macOS Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests-macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Build macOS app
        run: xcodebuild -scheme TrimTally -destination "platform=macOS,arch=arm64" build

  tests-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Build iOS app
        run: xcodebuild -scheme TrimTally -destination "platform=iOS Simulator,name=iPhone 17" build

      - name: Run iOS unit tests
        run: xcodebuild -scheme TrimTally -destination "platform=iOS Simulator,name=iPhone 17" test
