name: Apple Platform Builds and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests-macos:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build macOS app
        run: xcodebuild -scheme TrimTally -destination "platform=macOS,arch=arm64" CODE_SIGNING_ALLOWED=NO build

      - name: Run macOS unit tests
        run: xcodebuild -scheme TrimTally -destination "platform=macOS,arch=arm64" CODE_SIGNING_ALLOWED=NO test

  tests-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Select iOS simulator
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build iOS app
        run: xcodebuild -scheme TrimTally -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" CODE_SIGNING_ALLOWED=NO build

      - name: Run iOS unit tests
        run: xcodebuild -scheme TrimTally -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" CODE_SIGNING_ALLOWED=NO test
